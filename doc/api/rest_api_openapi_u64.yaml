  /v1/help:
    get:
      tags:
        - About
      summary: Reserved help endpoint
      description: 'Registered since the REST interface was introduced, but never implemented. It requires a `command` argument, does nothing with the value, and answers with a fixed HTML page rather than JSON. The header it sends spells the content type `text_html`, which is not a media type, so most clients treat the body as plain text. It is documented here because the firmware serves it, not because there is anything useful to read from it.'
      operationId: getHelp
      parameters:
        - name: command
          in: query
          required: true
          description: Name of the call to describe. The value is not used.
          schema:
            type: string
          example: readmem
      responses:
        '200':
          description: A fixed HTML page.
          content:
            text/html:
              schema:
                type: string
                format: binary
        '400':
          description: An HTML page listing the missing argument.
          content:
            text/html:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/info:
    get:
      tags:
        - About
      summary: Product and version information
      description: |2-
        Identifies the device: product name, firmware version, FPGA build number, host name and unique id. `core_version` is the version of the C64 core and is present on Ultimate 64 hardware only. `unique_id` is left out when the device has none configured.

        The same information is also available without HTTP, from the Ultimate Ident Service on UDP port 64, which answers a broadcast and so can be used to find a device whose address is not known.
      operationId: getInfo
      responses:
        '200':
          description: What the device is and what it is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
              examples:
                Ultimate 64 Elite:
                  value:
                    product: Ultimate 64 Elite (V1.49) 3.14d
                    firmware_version: '3.14d'
                    fpga_version: '122'
                    core_version: '1.49'
                    hostname: Ultimate-64-Elite-C89085
                    unique_id: D09B96
                    errors: []
                Ultimate II+:
                  value:
                    product: '1541 Ultimate II+ 3.14d'
                    firmware_version: '3.14d'
                    fpga_version: '11f'
                    hostname: Ultimate-II-Plus
                    errors: []
        '403':
          $ref: '#/components/responses/Forbidden'
  '/v1/machine:debugreg':
    get:
      tags:
        - Machine
      summary: Read the debug register
      description: 'Reads the Ultimate 64 debug register at $D7FF and returns it as two hexadecimal digits. The register controls FPGA debug facilities and is not part of the C64 memory map that `machine:readmem` reaches.'
      operationId: readDebugRegister
      responses:
        '200':
          description: The contents of the register.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebugRegisterResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
        - Machine
      summary: Write the debug register
      description: 'Writes `value` to the debug register at $D7FF and returns what the register reads back afterwards, which is not necessarily what was written: some bits are driven by the hardware.'
      operationId: writeDebugRegister
      parameters:
        - name: value
          in: query
          required: true
          description: Byte to write, in hexadecimal.
          schema:
            type: string
          example: '1F'
      responses:
        '200':
          description: The register after the write.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebugRegisterResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  '/v1/machine:heap':
    get:
      tags:
        - Diagnostics
      summary: Read heap statistics
      description: |2-
        Reports the FreeRTOS heap. Every dynamic allocation in the firmware ends up there, `new` and `malloc` alike, so one free figure accounts for all of it.

        `free` is the number to diff: sample it, do a body of work, sample it again, and a difference that does not come back is a leak. `min_ever_free` is the low water mark since boot. It never recovers, so it shows how much headroom there has ever been but cannot tell a leak from a transient peak.
      operationId: getHeapStatistics
      responses:
        '200':
          description: The state of the heap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeapResponse'
              examples:
                Heap:
                  value:
                    free: 1583280
                    min_ever_free: 1502864
                    total: 2097152
                    errors: []
        '403':
          $ref: '#/components/responses/Forbidden'
  '/v1/machine:input':
    get:
      tags:
        - Input
      summary: Read the keyboard and joystick state
      description: |2-
        Returns every key and joystick input that is currently held, both the ones this API is holding and the ones the Ultimate menu is holding, so the answer matches what the machine sees.

        Keyboard and joystick injection needs the Ultimate 64 hardware that drives those lines. The cartridges register the call so that clients get a clear answer, but it always reports 501 there.
      operationId: getInputState
      responses:
        '200':
          description: What is being held right now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InputStateResponse'
              examples:
                Shift and fire:
                  value:
                    keyboard:
                      inputs:
                        - left_shift
                        - a
                    joysticks:
                      - port: 1
                        inputs:
                          - up
                          - fire
                      - port: 2
                        inputs: []
                    errors: []
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Could not create REST input mutex.:
                  value:
                    errors:
                      - Could not create REST input mutex.
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Keyboard and joystick injection require Ultimate 64-class hardware.:
                  value:
                    errors:
                      - Keyboard and joystick injection require Ultimate 64-class hardware.
    post:
      tags:
        - Input
      summary: Apply keyboard and joystick events
      description: |2-
        Applies up to 64 input events in the order they are given and returns the state that results. The whole batch is validated before any of it is applied, so a batch that is rejected changes nothing.

        `press` holds an input down until something releases it, `release` lets it go, and `tap` does both, which is what typing needs. A `release_all` event drops everything this API is holding, and a machine reset does the same.

        `restore` is not part of the keyboard matrix; it is wired to NMI. It has to appear on its own and only with transition `tap`.

        The request must be `application/json` and the body must be under 4096 bytes. Ultimate 64 hardware only; the cartridges answer 501.
      operationId: applyInputEvents
      requestBody:
        required: true
        description: The events to apply, in order.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InputBatch'
      responses:
        '200':
          description: What is held after the batch was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InputStateResponse'
              examples:
                After typing LOAD:
                  value:
                    keyboard:
                      inputs: []
                    joysticks:
                      - port: 1
                        inputs: []
                      - port: 2
                        inputs: []
                    errors: []
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                'Content type should be ''application/json''.':
                  value:
                    errors:
                      - 'Content type should be ''application/json''.'
                '`events` must contain 1..64 entries.':
                  value:
                    errors:
                      - '`events` must contain 1..64 entries.'
