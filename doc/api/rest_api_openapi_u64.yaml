      tags:
        - Machine
      summary: Reboot the machine
      description: |2-
        Resets the C64 and re-initialises the cartridge with it, which is what the Reboot entry in the menu does. Use this rather than `machine:reset` when a cartridge has to start from scratch.

        On Ultimate 64 hardware every key and joystick direction the input API is holding is released as part of the reboot.
      operationId: rebootMachine
      responses:
        '200':
          description: The machine was rebooted.
          content:
