  '/v1/files/{path}:create_d64':
    put:
      tags:
        - Files
      summary: Create an empty D64 image
      description: |2-
        Creates a file at the given path, fills it with zeros and formats it as a 1541 disk, so the result can be mounted straight away.

        `tracks` is 35 by default and may go up to 41; anything past 35 is the extended area that not every program can read. `diskname` is what goes in the directory header and defaults to the file name without its extension.
      operationId: createD64
      parameters:
        - name: path
          in: path
          required: true
          description: Path of the file on the device. It contains slashes and must be URL encoded.
          schema:
            type: string
          example: /Usb0/games/disk.d64
        - name: tracks
          in: query
          required: false
          description: Number of tracks to format.
          schema:
            type: integer
            minimum: 35
            maximum: 41
            default: 35
          example: 40
        - name: diskname
          in: query
          required: false
          description: Name in the directory header. Defaults to the file name without its extension.
          schema:
            type: string
          example: MY DISK
      responses:
        '200':
          description: The image was created and formatted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskImageResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Track count should be between 35 and 41.:
                  value:
                    errors:
                      - Track count should be between 35 and 41.
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FILE EXISTS:
                  value:
                    errors:
                      - FILE EXISTS
