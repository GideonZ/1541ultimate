  '/v1/machine:writemem':
    post:
      tags:
        - Machine
      summary: Upload bytes into C64 memory
      description: The same DMA write as the PUT form, with the bytes in the request body instead of the URL, which raises the limit from 128 bytes to 65536. The body may be sent raw or as a multipart file part. The write may not pass $FFFF.
      operationId: uploadMemory
      parameters:
        - name: address
          in: query
          required: true
          description: Start address in hexadecimal, 0000 to FFFF.
          schema:
            type: string
          example: '0801'
      requestBody:
        required: true
        description: The bytes to write.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '200':
          description: The range that was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryWriteResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid address:
                  value:
                    errors:
                      - Invalid address
                Memory write exceeds location $FFFF:
                  value:
                    errors:
                      - Memory write exceeds location $FFFF
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Could not read data from attachment:
                  value:
                    errors:
                      - Could not read data from attachment
        '412':
          description: Precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Expected Body, but got none.:
                  value:
                    errors:
                      - Expected Body, but got none.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Out of memory:
                  value:
                    errors:
                      - Out of memory
    put:
      tags:
        - Machine
      summary: Write bytes to C64 memory
      description: |2-
        Performs a DMA write on the cartridge bus. `data` carries the bytes as hexadecimal, two characters per byte, and at most 128 bytes fit here; use the POST form for more. The write may not pass $FFFF.

        The write is decoded through the bank configuration that is in force at the time, the same way a write by the CPU would be, so a write to $D020 reaches the VIC register while I/O is mapped in.
      operationId: writeMemory
      parameters:
        - name: address
          in: query
          required: true
          description: Start address in hexadecimal, 0000 to FFFF.
          schema:
            type: string
          example: D020
        - name: data
          in: query
          required: true
          description: Bytes to write, hexadecimal, two characters each, 1 to 128 bytes.
          schema:
            type: string
          example: '0006'
      responses:
        '200':
          description: The range that was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryWriteResponse'
              examples:
                Border and background:
                  value:
                    address: d020-d021
                    errors: []
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid address:
                  value:
                    errors:
                      - Invalid address
                Maximum length of 128 bytes exceeded. Consider using POST method with attachment.:
                  value:
                    errors:
                      - Maximum length of 128 bytes exceeded. Consider using POST method with attachment.
                'Use this API call to write at least one byte!':
                  value:
                    errors:
                      - 'Use this API call to write at least one byte!'
                Memory write exceeds location $FFFF:
                  value:
                    errors:
                      - Memory write exceeds location $FFFF
        '403':
          $ref: '#/components/responses/Forbidden'
