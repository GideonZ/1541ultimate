# yaml-language-server: $schema=https://raw.githubusercontent.com/OAI/OpenAPI-Specification/main/schemas/v3.1/schema.yaml
# Generated by tools/openapi/generate.py from the firmware route sources. Do not edit.
# Run `make openapi` after changing an API_CALL or its API_DOC block.
openapi: '3.1.0'
info:
  title: Ultimate 64 REST API
  version: '0.1'
  summary: REST interface of the Ultimate firmware on the Ultimate 64, Ultimate 64 Elite and Ultimate 64 Elite II.
  description: |2
    The HTTP interface of the Ultimate firmware, available since release 3.11.

    It covers the Ultimate 64, Ultimate 64 Elite and Ultimate 64 Elite II. There is a separate document for the other family,
    because which calls a product serves is decided when the firmware is compiled
    rather than at run time.

    This document is generated from the firmware sources. Every call in it is
    registered in `software/api/route_*.cc` in the build it came from, and no call
    registered there is missing from it, so a generated client cannot offer a method
    that these products do not have.

    ## Calling convention

    A request is addressed as `/v1/<route>/<path>:<command>?<arguments>`. The verb
    selects the kind of operation: `GET` reads, `PUT` acts on arguments carried in
    the URL, and `POST` acts on data carried in the request body.

    ## Responses

    Unless a call returns a binary attachment, the response is
    `Content-Type: application/json` and carries an `errors` array. The array is
    empty when the call succeeded. A call that returns an attachment answers with
    `Content-Type: application/octet-stream` and a `Content-Disposition` header, or
    with `203 No Content` when there is nothing to return.

    ## Authentication

    From release 3.12 a network password can be configured on the device. While one
    is set, every request must carry it in an `X-Password` header. A request without
    the header, or with the wrong value, is answered with `403 Forbidden`. While no
    password is configured the header is ignored.
  contact:
    name: '1541 Ultimate firmware'
    url: 'https://github.com/GideonZ/1541ultimate'
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: 'http://{host}'
    description: An Ultimate device on the local network.
    variables:
      host:
        default: ultimate64
        description: Host name or address of the device.
tags:
  - name: About
    description: Firmware, FPGA and product identification.
  - name: Configuration
    description: Read and write the settings the menu also exposes.
  - name: Machine
    description: Reset, pause, memory access and the Ultimate menu.
  - name: Input
    description: Keyboard and joystick injection.
  - name: Drives
    description: The emulated disk drives and the images mounted in them.
  - name: Runners
    description: Start a program, cartridge or tune on the machine.
  - name: Files
    description: Inspect files and create empty disk images.
  - name: Streams
    description: Video, audio and debug streams sent to a listening host.
  - name: Diagnostics
    description: Bus timing capture and heap accounting.
externalDocs:
  description: Ultimate firmware documentation
  url: 'https://1541u-documentation.readthedocs.io/en/latest/api/api_calls.html'
security:
  - NetworkPassword: []
paths:
  /v1/configs:
    get:
      tags:
        - Configuration
      summary: List the configuration categories
      description: |2-
        Reads the same settings the menu shows, at one of three levels of detail. With no path it lists the category names. With a category it gives the current value of every item in it. With a category and an item it describes each matching item in full: the current value, the default, and either the accepted values of an enumeration or the range and format of a number.

        Both path elements are patterns, so `drive*` selects every category whose name starts with `drive` and `*bus*` selects every item with `bus` in its name. Category and item names contain spaces and must be URL encoded.

        Which categories exist depends on the product and on what is installed, so the list is not the same on two devices.
      operationId: listConfigCategories
      responses:
        '200':
          description: The categories on this device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigCategoriesResponse'
              examples:
                Categories:
                  value:
                    categories:
                      - Drive A Settings
                      - Network Settings
                      - User Interface Settings
                    errors: []
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Configuration
      summary: Change several settings at once
      description: |2-
        Applies a JSON object of categories to items to values in a single request, which is how a full configuration is restored without one call per setting.

        Names are matched exactly here, not as patterns. Every item in the body is attempted whatever happens to the others, so a body with one bad name still applies the rest and the response says which ones failed. Like the PUT form, this changes memory only until `configs:save_to_flash` is called.

        The request must be `application/json` and at most 32 KB.
      operationId: updateConfigs
      requestBody:
        required: true
        description: Categories, items and the values to set.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdate'
      responses:
        '200':
          description: Every setting in the body was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Nothing could be parsed, or some settings were rejected. The errors array names them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                One bad item name:
                  value:
                    errors:
                      - '''Drive Speed'' is not a valid item name in category ''Drive A Settings''.'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          description: Precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Expected Body, but got none.:
                  value:
                    errors:
                      - Expected Body, but got none.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Could not buffer attachment.:
                  value:
                    errors:
                      - Could not buffer attachment.
  '/v1/configs/{category}':
    get:
      tags:
        - Configuration
      summary: Read the values in a category
      description: |2-
        Reads the same settings the menu shows, at one of three levels of detail. With no path it lists the category names. With a category it gives the current value of every item in it. With a category and an item it describes each matching item in full: the current value, the default, and either the accepted values of an enumeration or the range and format of a number.

        Both path elements are patterns, so `drive*` selects every category whose name starts with `drive` and `*bus*` selects every item with `bus` in its name. Category and item names contain spaces and must be URL encoded.

        Which categories exist depends on the product and on what is installed, so the list is not the same on two devices.
      operationId: getConfigCategory
      parameters:
        - name: category
          in: path
          required: true
          description: Category name or pattern. Names contain spaces, so this has to be URL encoded.
          schema:
            type: string
          example: 'Drive%20A%20Settings'
      responses:
        '200':
          description: The current value of every matching item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigValuesResponse'
              examples:
                Drive A:
                  value:
                    Drive A Settings:
                      Drive: Enabled
                      Drive Type: '1541'
                      Drive Bus ID: 8
                    errors: []
        '403':
          $ref: '#/components/responses/Forbidden'
  '/v1/configs/{category}/{item}':
    get:
      tags:
        - Configuration
      summary: Read a setting in full
      description: |2-
        Reads the same settings the menu shows, at one of three levels of detail. With no path it lists the category names. With a category it gives the current value of every item in it. With a category and an item it describes each matching item in full: the current value, the default, and either the accepted values of an enumeration or the range and format of a number.

        Both path elements are patterns, so `drive*` selects every category whose name starts with `drive` and `*bus*` selects every item with `bus` in its name. Category and item names contain spaces and must be URL encoded.

        Which categories exist depends on the product and on what is installed, so the list is not the same on two devices.
      operationId: getConfigItem
      parameters:
        - name: category
          in: path
          required: true
          description: Category name or pattern. Names contain spaces, so this has to be URL encoded.
          schema:
            type: string
          example: 'Drive%20A%20Settings'
        - name: item
          in: path
          required: true
          description: Item name or pattern, URL encoded.
          schema:
            type: string
          example: 'Drive%20Bus%20ID'
      responses:
        '200':
          description: Every matching item, described in full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigItemsResponse'
              examples:
                One item:
                  value:
                    Drive A Settings:
                      Drive Bus ID:
                        current: 8
                        min: 8
                        max: 11
                        format: '%d'
                        default: 8
                    errors: []
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
        - Configuration
      summary: Change a setting
      description: |2-
        Sets one setting. The path names the category and the item, both matched as patterns, and the first match wins, so a pattern that matches more than one item sets whichever comes first.

        The change takes effect at once but lives only in memory. It survives until the device reboots, and no longer, unless `configs:save_to_flash` writes it.
      operationId: setConfigItem
      parameters:
        - name: category
          in: path
          required: true
          description: Category name or pattern. Names contain spaces, so this has to be URL encoded.
          schema:
            type: string
          example: 'Drive%20A%20Settings'
        - name: item
          in: path
          required: true
          description: Item name or pattern, URL encoded.
          schema:
            type: string
          example: 'Drive%20Bus%20ID'
        - name: value
          in: query
          required: true
          description: 'The new value: one of the accepted values for an enumeration, a number for a numeric setting, or free text for a string setting.'
          schema:
            type: string
          example: '9'
      responses:
        '200':
          description: The setting was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Value 12 is outside of the allowable range (8-11):
                  value:
                    errors:
                      - Value 12 is outside of the allowable range (8-11)
                'Value ''Maybe'' is not a valid choice for item Drive':
                  value:
                    errors:
                      - 'Value ''Maybe'' is not a valid choice for item Drive'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                'There is no config category that matches ''drive c*''':
                  value:
                    errors:
                      - 'There is no config category that matches ''drive c*'''
                'Item ''speed'' not found in this configuration category [Drive A Settings].':
                  value:
                    errors:
                      - 'Item ''speed'' not found in this configuration category [Drive A Settings].'
  '/v1/configs/{category}:load_from_flash':
    put:
      tags:
        - Configuration
      summary: Reload matching categories
      description: Throws away the settings in memory and reads them back from flash, undoing every change that has not been saved. With a category in the path only that category is reloaded and the response lists what was touched.
      operationId: loadConfigCategoryFromFlash
      parameters:
        - name: category
          in: path
          required: true
          description: Category name or pattern, URL encoded.
          schema:
            type: string
          example: 'Drive%20A%20Settings'
      responses:
        '200':
          description: The categories that were reloaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigStoreListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Path depth exceeds 1.:
                  value:
                    errors:
                      - Path depth exceeds 1.
        '403':
          $ref: '#/components/responses/Forbidden'
  '/v1/configs/{category}:reset_to_default':
    put:
      tags:
        - Configuration
      summary: Reset matching categories
      description: 'Puts the settings back to their factory values and applies them immediately. Flash is not touched, so `configs:load_from_flash` undoes this and `configs:save_to_flash` makes it permanent.'
      operationId: resetConfigCategoryToDefault
      parameters:
        - name: category
          in: path
          required: true
          description: Category name or pattern, URL encoded.
          schema:
            type: string
          example: 'Drive%20A%20Settings'
      responses:
        '200':
          description: The categories that were reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigStoreListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Path depth exceeds 1.:
                  value:
                    errors:
                      - Path depth exceeds 1.
        '403':
          $ref: '#/components/responses/Forbidden'
  '/v1/configs/{category}:save_to_flash':
    put:
      tags:
        - Configuration
      summary: Save matching categories
      description: |2-
        Writes the settings that have changed since the last save into flash, so that they survive a power cycle. Only categories that are actually stale are written, and the response lists which ones those were, so an empty list means there was nothing to do.

        Take care when the device has booted into safe mode: the settings in memory are defaults then, and saving replaces the stored values with them.
      operationId: saveConfigCategoryToFlash
      parameters:
        - name: category
          in: path
          required: true
          description: Category name or pattern, URL encoded.
          schema:
            type: string
          example: 'Drive%20A%20Settings'
      responses:
        '200':
          description: The categories that were written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigStoreListResponse'
              examples:
                One category written:
                  value:
                    written:
                      - Drive A Settings
                    errors: []
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Path depth exceeds 1.:
                  value:
                    errors:
                      - Path depth exceeds 1.
        '403':
          $ref: '#/components/responses/Forbidden'
  '/v1/configs:load_from_flash':
    put:
      tags:
        - Configuration
      summary: Reload every category
      description: Throws away the settings in memory and reads them back from flash, undoing every change that has not been saved. With a category in the path only that category is reloaded and the response lists what was touched.
      operationId: loadConfigsFromFlash
      responses:
        '200':
          description: Every category was reloaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Path depth exceeds 1.:
                  value:
                    errors:
                      - Path depth exceeds 1.
        '403':
          $ref: '#/components/responses/Forbidden'
  '/v1/configs:reset_to_default':
    put:
      tags:
        - Configuration
      summary: Reset every category
      description: 'Puts the settings back to their factory values and applies them immediately. Flash is not touched, so `configs:load_from_flash` undoes this and `configs:save_to_flash` makes it permanent.'
      operationId: resetConfigsToDefault
      responses:
        '200':
          description: Every category was reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Path depth exceeds 1.:
                  value:
                    errors:
                      - Path depth exceeds 1.
        '403':
          $ref: '#/components/responses/Forbidden'
  '/v1/configs:save_to_flash':
    put:
      tags:
        - Configuration
      summary: Save every stale category
      description: |2-
        Writes the settings that have changed since the last save into flash, so that they survive a power cycle. Only categories that are actually stale are written, and the response lists which ones those were, so an empty list means there was nothing to do.

        Take care when the device has booted into safe mode: the settings in memory are defaults then, and saving replaces the stored values with them.
      operationId: saveConfigsToFlash
      responses:
        '200':
          description: The categories that were written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigStoreListResponse'
              examples:
                One category written:
                  value:
                    written:
                      - Drive A Settings
                    errors: []
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Path depth exceeds 1.:
                  value:
                    errors:
                      - Path depth exceeds 1.
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/drives:
    get:
      tags:
        - Drives
      summary: List the drives
      description: 'Reports every drive this device has: the emulated drives `a` and `b`, and `softiec`, the IEC file system that serves files straight from storage. For each one it gives whether it is powered, its bus id, the model it is emulating, the ROM it is running and the image it has mounted. Which drives are present depends on the product and on the configuration, so this is the call to make before assuming a drive exists.'
      operationId: listDrives
      responses:
        '200':
          description: The drives and what is in them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrivesResponse'
              examples:
                One drive with a disk:
                  value:
                    drives:
                      - a:
                          enabled: true
                          bus_id: 8
                          type: '1541'
                          rom: '1541.rom'
                          image_file: disk.d64
                          image_path: /Usb0/games
                    errors: []
        '403':
          $ref: '#/components/responses/Forbidden'
  '/v1/drives/{drive}:load_rom':
    post:
      tags:
        - Drives
      summary: Upload a drive ROM
      description: The same as the PUT form, with the ROM image in the request body rather than on the device.
      operationId: uploadDriveRom
      parameters:
        - name: drive
          in: path
          required: true
          description: 'Which drive to act on. `a` and `b` are the emulated drives, `softiec` is the IEC file system.'
          schema:
            type: string
            enum:
              - a
              - b
              - softiec
          example: a
      requestBody:
        required: true
        description: The ROM image to load.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '200':
          description: The drive is running the new ROM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Upload of file failed.:
                  value:
                    errors:
                      - Upload of file failed.
                'Invalid Drive ''c''':
                  value:
                    errors:
                      - 'Invalid Drive ''c'''
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          description: Precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Drive ROM is invalid:
                  value:
                    errors:
                      - Drive ROM is invalid
                Expected Body, but got none.:
                  value:
                    errors:
                      - Expected Body, but got none.
        '423':
          description: Locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Could not obtain lock of subsystem:
                  value:
                    errors:
                      - Could not obtain lock of subsystem
    put:
      tags:
        - Drives
      summary: Load a drive ROM
      description: 'Replaces the ROM the drive runs with an image from the device and resets the drive into it. 16K and 32K images are accepted; a 32K image is what a drive with a patched or extended DOS needs.'
      operationId: loadDriveRom
      parameters:
        - name: drive
          in: path
          required: true
          description: 'Which drive to act on. `a` and `b` are the emulated drives, `softiec` is the IEC file system.'
          schema:
            type: string
            enum:
              - a
              - b
              - softiec
          example: a
        - name: file
          in: query
          required: true
          description: Path of the ROM image on the device.
          schema:
            type: string
          example: /Usb0/roms/1541-ii.rom
      responses:
        '200':
          description: The drive is running the new ROM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                'Invalid Drive ''c''':
                  value:
                    errors:
                      - 'Invalid Drive ''c'''
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          description: Precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Drive ROM not found:
                  value:
                    errors:
                      - Drive ROM not found
                Drive ROM is invalid:
                  value:
                    errors:
                      - Drive ROM is invalid
                ROM image is too large:
                  value:
                    errors:
                      - ROM image is too large
        '423':
          description: Locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Could not obtain lock of subsystem:
                  value:
                    errors:
                      - Could not obtain lock of subsystem
  '/v1/drives/{drive}:mount':
    post:
      tags:
        - Drives
      summary: Upload and mount a disk image
      description: 'The same as the PUT form, with the image in the request body. The upload is written to a temporary file on the device first, and the name it is given comes from the multipart part or from the `Content-Disposition` header. That name is also where the default `type` comes from, so an upload whose name has no useful extension needs `type` to be given.'
      operationId: uploadAndMountImage
      parameters:
        - name: drive
          in: path
          required: true
          description: 'Which drive to act on. `a` and `b` are the emulated drives, `softiec` is the IEC file system.'
          schema:
            type: string
            enum:
              - a
              - b
              - softiec
          example: a
        - name: type
          in: query
          required: false
          description: How to read the image. Defaults to the extension of the uploaded name.
          schema:
            type: string
            enum:
              - d64
              - g64
              - d71
              - g71
              - d81
          example: d64
        - name: mode
          in: query
          required: false
          description: What happens to writes.
          schema:
            type: string
            enum:
              - readwrite
              - readonly
              - unlinked
            default: readwrite
          example: unlinked
      requestBody:
        required: true
        description: The image to mount.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '200':
          description: The image was mounted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveMountResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Upload of file failed.:
                  value:
                    errors:
                      - Upload of file failed.
                'Invalid Drive ''c''':
                  value:
                    errors:
                      - 'Invalid Drive ''c'''
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          description: Precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Expected Body, but got none.:
                  value:
                    errors:
                      - Expected Body, but got none.
        '423':
          description: Locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Could not obtain lock of subsystem:
                  value:
                    errors:
                      - Could not obtain lock of subsystem
    put:
      tags:
        - Drives
      summary: Mount a disk image
      description: |2-
        Mounts an image that is already on the device.

        `type` decides how the image is read and defaults to the extension of the file name, so it only has to be given when the extension is missing or wrong. `mode` decides what happens to writes: `readwrite` puts them in the file, `readonly` write protects the disk so the drive refuses them, and `unlinked` accepts them in memory but never writes them back.
      operationId: mountImage
      parameters:
        - name: drive
          in: path
          required: true
          description: 'Which drive to act on. `a` and `b` are the emulated drives, `softiec` is the IEC file system.'
          schema:
            type: string
            enum:
              - a
              - b
              - softiec
          example: a
        - name: image
          in: query
          required: true
          description: Path of the image on the device.
          schema:
            type: string
          example: /Usb0/games/disk.d64
        - name: type
          in: query
          required: false
          description: How to read the image. Defaults to the file extension.
          schema:
            type: string
            enum:
              - d64
              - g64
              - d71
              - g71
              - d81
          example: d64
        - name: mode
          in: query
