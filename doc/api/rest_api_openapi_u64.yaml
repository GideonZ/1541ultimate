        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          description: Precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Expected Body, but got none.:
                  value:
                    errors:
                      - Expected Body, but got none.
        '423':
          description: Locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Could not obtain lock of subsystem:
                  value:
                    errors:
                      - Could not obtain lock of subsystem
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SubSystem does not exist:
                  value:
                    errors:
                      - SubSystem does not exist
    put:
      tags:
        - Runners
      summary: Load and start a program
      description: DMA loads a PRG file from the device and starts it, the way selecting it in the menu would. A BASIC program is run and a machine code program is called at its load address.
      operationId: runPrg
      parameters:
        - name: file
          in: query
          required: true
          description: Path of the PRG file on the device.
          schema:
            type: string
          example: /Usb0/games/game.prg
      responses:
        '200':
          description: The program was started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Cannot open file:
                  value:
                    errors:
                      - Cannot open file
        '423':
          description: Locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Could not obtain lock of subsystem:
                  value:
                    errors:
                      - Could not obtain lock of subsystem
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SubSystem does not exist:
                  value:
                    errors:
                      - SubSystem does not exist
  '/v1/runners:sidplay':
    post:
      tags:
        - Runners
      summary: Upload and play a SID tune
      description: 'The same as the PUT form, with the tune in the request body. A second file part, if the request carries one, is taken as the matching `.ssl` song length file, which the player uses to move on at the end of a subtune.'
      operationId: uploadAndPlaySid
      parameters:
        - name: songnr
          in: query
          required: false
          description: Subtune to play, counting from 1. 0 uses the start song of the file.
          schema:
            type: integer
            default: 0
          example: 2
      requestBody:
        required: true
        description: The tune to play, and optionally its song length file.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
      responses:
        '200':
          description: The tune is playing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Upload of file failed.:
                  value:
                    errors:
                      - Upload of file failed.
                Invalid Song Number Requested:
                  value:
                    errors:
                      - Invalid Song Number Requested
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          description: Precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Expected Body, but got none.:
                  value:
                    errors:
                      - Expected Body, but got none.
    put:
      tags:
        - Runners
      summary: Play a SID tune
      description: |2-
        Loads a SID file from the device and starts it. The player takes over the machine, so whatever was running stops.

        `songnr` selects a subtune, counting from 1. Leaving it out, or passing 0, plays the start song the file itself names.
      operationId: playSid
      parameters:
        - name: file
          in: query
          required: true
          description: Path of the SID file on the device.
          schema:
            type: string
          example: /Usb0/music/tune.sid
        - name: songnr
          in: query
          required: false
          description: Subtune to play, counting from 1. 0 uses the start song of the file.
          schema:
            type: integer
            default: 0
          example: 2
      responses:
        '200':
          description: The tune is playing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid Song Number Requested:
                  value:
                    errors:
                      - Invalid Song Number Requested
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Cannot open file:
                  value:
                    errors:
                      - Cannot open file
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SID File Memory Rollover:
                  value:
                    errors:
                      - SID File Memory Rollover
  '/v1/streams/{stream}:start':
    put:
      tags:
        - Streams
      summary: Start a data stream
      description: |2-
        Sends the named stream to a listening host over UDP. `video` carries the VIC output, `audio` the sound, and `debug` a trace of the cartridge bus.

        `ip` may be an address or a host name, and may carry a port as `address:port`. Without a port the stream goes to 11000 for video, 11001 for audio and 11002 for debug. A multicast group is accepted in place of a single host, in which case every listener that joined the group receives the stream.

        Video and debug share hardware and cannot both run, so starting video stops debug first.
      operationId: startStream
      parameters:
        - name: stream
          in: path
          required: true
          description: Which stream to act on.
          schema:
            type: string
            enum:
              - video
              - audio
              - debug
          example: video
        - name: ip
          in: query
          required: true
          description: Where to send the stream. An address, optionally followed by a port.
          schema:
            type: string
          example: '192.168.1.10:11000'
      responses:
        '200':
          description: The stream is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                'Unrecognized stream name ''screen''':
                  value:
                    errors:
                      - 'Unrecognized stream name ''screen'''
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                No Operational Network Interface:
                  value:
                    errors:
                      - No Operational Network Interface
  '/v1/streams/{stream}:stop':
    put:
      tags:
        - Streams
      summary: Stop a data stream
      description: Stops the named stream. Stopping a stream that is not running is not an error, so this is safe to call unconditionally when a client shuts down.
      operationId: stopStream
      parameters:
        - name: stream
          in: path
          required: true
          description: Which stream to act on.
          schema:
            type: string
            enum:
              - video
              - audio
              - debug
          example: video
      responses:
        '200':
          description: The stream is stopped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                'Unrecognized stream name ''screen''':
                  value:
                    errors:
                      - 'Unrecognized stream name ''screen'''
  /v1/version:
    get:
      tags:
        - About
      summary: Version of the REST interface
      description: 'Returns the version of the HTTP interface itself. This is not the firmware version, which `GET /v1/info` reports.'
      operationId: getVersion
      responses:
        '200':
          description: The interface version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
              examples:
                Version:
                  value:
                    version: '0.1'
                    errors: []
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    NetworkPassword:
      type: apiKey
      in: header
      name: X-Password
      description: 'The network password configured on the device, sent on every request. Required only while a password is configured; ignored otherwise.'
  responses:
    Forbidden:
      description: A network password is configured on the device and the request did not carry it in an X-Password header, or carried the wrong value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            Forbidden.:
              value:
                errors:
                  - Forbidden.
  schemas:
    ConfigCategoriesResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            categories:
              type: array
              description: Name of every configuration category on this device.
              items:
                type: string
    ConfigItem:
      type: object
      description: 'A single setting. Which of the optional members are present depends on the type of the setting: an enumeration carries values, a numeric setting carries min, max and format, and a string setting with suggestions carries presets.'
      required:
        - current
      properties:
        current:
          oneOf:
            - type: string
            - type: integer
          description: Value in effect.
        default:
          oneOf:
            - type: string
            - type: integer
          description: Value the setting reverts to on reset to default.
        values:
          type: array
          description: Accepted values of an enumeration setting.
          items:
            type: string
        presets:
          type: array
          description: Suggested values of a string setting. Other values are accepted.
          items:
            type: string
        min:
          type: integer
          description: Lowest accepted value of a numeric setting.
        max:
          type: integer
          description: Highest accepted value of a numeric setting.
        format:
          type: string
          description: printf style format the menu renders a numeric setting with.
    ConfigItemsResponse:
      type: object
      description: One property per matching category, each holding one property per matching item described in full.
      required:
        - errors
      properties:
        errors:
          $ref: '#/components/schemas/Errors'
      additionalProperties:
        type: object
        additionalProperties:
          $ref: '#/components/schemas/ConfigItem'
    ConfigStoreListResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          description: Names of the categories the call acted on. The member is present only when the request selected categories by path.
          properties:
            loaded:
              type: array
              items:
                type: string
            written:
              type: array
              items:
                type: string
            reset:
              type: array
              items:
                type: string
    ConfigUpdate:
      type: object
      description: One property per category to update, each holding one property per item to set. Categories and items are matched by exact name.
      additionalProperties:
        type: object
        additionalProperties:
          oneOf:
            - type: string
            - type: integer
    ConfigValuesResponse:
      type: object
      description: One property per matching category, each holding one property per matching item whose value is the current setting.
      required:
        - errors
      properties:
        errors:
          $ref: '#/components/schemas/Errors'
      additionalProperties:
        type: object
        additionalProperties:
          oneOf:
            - type: string
            - type: integer
    DebugRegisterResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - value
          properties:
            value:
              type: string
              description: Contents of the debug register at $D7FF, two hexadecimal digits.
              examples:
                - '1F'
    DiskImageResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            path:
              type: string
              description: File that was created.
            tracks:
              type: integer
              description: Track count the image was formatted with.
            diskname:
              type: string
              description: Disk name written into the directory header.
            bytes_written:
              type: integer
              description: Bytes the firmware zeroed before formatting.
    DriveInfo:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether the drive is powered.
        bus_id:
          type: integer
          description: IEC device number, normally 8 to 11.
        type:
          type: string
          description: Emulated drive model.
          examples:
            - '1541'
        rom:
          type: string
          description: ROM image the drive is running.
        image_file:
          type: string
          description: File name of the mounted image, empty when none.
        image_path:
          type: string
          description: Directory the mounted image was loaded from.
        last_error:
          type: string
          description: Last IEC error, softiec only.
        partitions:
          type: array
          description: Partitions exposed by the IEC file system, softiec only.
          items:
            type: object
            properties:
              id:
                type: integer
              path:
                type: string
    DriveModeResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            mode:
              type: string
              description: Drive model that was selected.
              examples:
                - '1571'
    DriveMountResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          description: Echoes how the request was interpreted, which is useful when a mount is rejected.
          properties:
            Subsys:
              type: integer
              description: Subsystem the command was sent to.
            Ftype:
              type: integer
              description: Drive model implied by the image type.
            command:
              type: integer
              description: Mount command including the mode flags.
            file:
              type: string
              description: Image the drive was told to mount.
    DrivesResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            drives:
              type: array
              description: 'One entry per drive present in this build. Each entry has a single property named after the drive, `a` and `b` for the emulated drives and `softiec` for the IEC file system.'
              items:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/DriveInfo'
    ErrorResponse:
      type: object
      description: Present on every JSON response.
      required:
        - errors
      properties:
        errors:
          $ref: '#/components/schemas/Errors'
    Errors:
      type: array
      description: One entry per problem the firmware reported. Empty when the call succeeded.
      items:
        type: string
    FileInfoResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            files:
              type: object
              properties:
                path:
                  type: string
                  description: Path as the request spelled it.
                filename:
                  type: string
                  description: Long file name as stored.
                size:
                  type: integer
                  description: Size in bytes.
                extension:
                  type: string
                  description: Extension, upper case, without a dot.
    FileUpload:
      type: object
      description: A multipart form with the payload as a file part. The firmware takes the name from the part, or from the Content-Disposition header when the body is sent raw instead.
      properties:
        file:
          type: string
          format: binary
    HeapResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            free:
              type: integer
              description: Bytes free in the FreeRTOS heap right now. Diff two samples to find a leak.
            min_ever_free:
              type: integer
              description: Low water mark since boot. It never recovers, so it shows headroom but cannot distinguish a leak from a transient peak.
            total:
              type: integer
              description: Size of the heap.
    InfoResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            product:
              type: string
              description: Full product name, including the core version on Ultimate 64 hardware.
            firmware_version:
              type: string
            fpga_version:
              type: string
              description: FPGA build number in hexadecimal.
            core_version:
              type: string
              description: C64 core version. Ultimate 64 hardware only.
            hostname:
              type: string
            unique_id:
              type: string
              description: Omitted when the device has no unique id configured.
    InputBatch:
      type: object
      description: A batch of input events, applied in order. The whole batch is validated before any of it is applied, so a rejected batch changes nothing.
      required:
        - events
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/InputEvent'
    InputEvent:
      oneOf:
        - $ref: '#/components/schemas/KeyboardEvent'
        - $ref: '#/components/schemas/JoystickEvent'
        - $ref: '#/components/schemas/ReleaseAllEvent'
    InputStateResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            keyboard:
              type: object
              properties:
                inputs:
                  type: array
                  description: Every key currently held, by the same names the request uses.
                  items:
                    type: string
            joysticks:
              type: array
              description: One entry per port, always both ports, in order.
              items:
                type: object
                properties:
                  port:
                    type: integer
                    enum:
                      - 1
                      - 2
                  inputs:
                    type: array
                    description: Every direction or button currently held.
                    items:
                      type: string
    InputTransition:
      type: string
      enum:
        - press
        - release
        - tap
      description: '`press` holds the input until something releases it, `release` lets it go, and `tap` presses and releases it for you.'
    JoystickEvent:
      type: object
      required:
        - kind
        - port
        - inputs
        - transition
      additionalProperties: false
      properties:
        kind:
          const: joystick
        port:
          type: integer
          enum:
            - 1
            - 2
          description: Control port to drive.
        transition:
          $ref: '#/components/schemas/InputTransition'
        inputs:
          type: array
          minItems: 1
          maxItems: 7
          description: Directions and buttons, no duplicates.
          items:
            $ref: '#/components/schemas/JoystickInput'
    JoystickInput:
      type: string
      description: 'A direction or button of a joystick. `fire2` and `fire3` need a pad that has them.'
      enum:
        - up
        - down
        - left
        - right
        - fire
        - fire2
        - fire3
    KeyboardEvent:
      type: object
      description: 'Keys to press, release or tap. `restore` is not part of the matrix and must appear on its own with transition `tap`.'
      required:
        - kind
        - inputs
        - transition
      additionalProperties: false
      properties:
        kind:
          const: keyboard
        transition:
          $ref: '#/components/schemas/InputTransition'
        inputs:
          type: array
          minItems: 1
          maxItems: 8
          description: Key names, no duplicates.
          items:
            $ref: '#/components/schemas/KeyboardInput'
    KeyboardInput:
      type: string
      description: 'A key of the C64 keyboard, plus `restore`, which is wired to NMI rather than to the matrix.'
      enum:
        - inst_del
        - return
        - cursor_left_right
        - f7
        - f1
        - f3
        - f5
        - cursor_up_down
        - '3'
        - w
        - a
        - '4'
        - z
        - s
        - e
        - left_shift
        - '5'
        - r
        - d
        - '6'
        - c
        - f
        - t
        - x
        - '7'
        - y
        - g
        - '8'
        - b
        - h
        - u
        - v
        - '9'
        - i
        - j
        - '0'
        - m
        - k
        - o
        - n
        - plus
        - p
        - l
        - minus
        - period
        - colon
        - at
        - comma
        - pound
        - star
        - semicolon
        - clr_home
        - right_shift
        - equals
        - arrow_up
        - slash
        - '1'
        - arrow_left
        - ctrl
        - '2'
        - space
        - commodore
        - q
        - run_stop
        - restore
    MemoryWriteResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            address:
              type: string
              description: Range that was written, as first-last in hexadecimal.
              examples:
                - d020-d021
    ReleaseAllEvent:
      type: object
      description: Releases every key and joystick input the API is holding. Takes no other members.
      required:
        - kind
      additionalProperties: false
      properties:
        kind:
          const: release_all
    VersionResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required:
            - version
          properties:
            version:
              type: string
              description: Version of the REST interface itself, not of the firmware.
              examples:
                - '0.1'
