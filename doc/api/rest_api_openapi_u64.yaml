  '/v1/machine:measure':
    get:
      tags:
        - Diagnostics
      summary: Capture cartridge bus timing
      description: |2-
        Samples the cartridge bus and returns the capture as a VCD file, which any waveform viewer opens. The traces are the dot clock, PHI2 and the copy the FPGA recovers from it, the address and data buses, the read/write line and the tri-state controls. The sample interval follows the FPGA clock of the product, so it is 20 ns, 16 ns or 15 ns depending on which one this is.

        The measurement block is an optional part of the FPGA build. Where it is absent, and it usually is on the cartridges, the call answers 501.
      operationId: measureBusTiming
      responses:
        '200':
          description: A VCD capture, offered as bus_measurement.vcd.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Out of memory:
                  value:
                    errors:
                      - Out of memory
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                The current FPGA build does not support timing measurement of the cartridge bus.:
                  value:
                    errors:
                      - The current FPGA build does not support timing measurement of the cartridge bus.
  '/v1/machine:menu_button':
    put:
      tags:
        - Machine
      summary: Press the menu button
      description: |2-
        Acts as if the menu button on the device had been pressed, which opens the Ultimate menu or closes it again. There is no way to ask whether the menu is open; `GET /v1/machine:menu_screen` answers 404 while it is not.

        While the menu is open it takes the keyboard, so keys injected through `POST /v1/machine:input` reach the menu rather than the running program.
      operationId: pushMenuButton
      responses:
        '200':
          description: The button press was delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          description: Locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Could not obtain lock of subsystem:
                  value:
                    errors:
                      - Could not obtain lock of subsystem
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SubSystem does not exist:
                  value:
                    errors:
                      - SubSystem does not exist
  '/v1/machine:menu_screen':
    get:
      tags:
        - Machine
      summary: Read the Ultimate menu screen
      description: |2-
        Returns what the Ultimate menu is drawing, as a binary attachment of exactly 2000 bytes: 1000 screen codes for a 40 by 25 screen in reading order, followed by the 1000 colour values for the same cells. This is the screen the menu owns, not the screen of the running C64 program.

        When the menu is not on screen there is nothing to return and the call answers 404, which is also the cheapest way to ask whether the menu is open.
      operationId: getMenuScreen
      responses:
        '200':
          description: '2000 bytes: 1000 screen codes followed by 1000 colour values.'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Menu screen unavailable.:
                  value:
                    errors:
                      - Menu screen unavailable.
