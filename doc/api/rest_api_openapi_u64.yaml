  '/v1/machine:reset':
    put:
      tags:
        - Machine
      summary: Reset the machine
      description: |2-
        Pulls reset on the C64. The machine restarts with whatever cartridge is active, which is not the same as starting from cold; use `machine:reboot` for that.

        On Ultimate 64 hardware every key and joystick direction the input API is holding is released as part of the reset, so a reset cannot leave an injected key stuck down.
      operationId: resetMachine
      responses:
