  '/v1/machine:readmem':
    get:
      tags:
        - Machine
      summary: Read C64 memory
      description: |2-
        Performs a DMA read on the cartridge bus and returns the bytes as a binary attachment. The read may not pass $FFFF.

        What comes back for an address that a ROM or an I/O register also occupies depends on the bank configuration at the moment of the read, so a read at $E000 returns the KERNAL or the RAM underneath it depending on the processor port. Pause the machine first if the values have to be consistent with each other.
      operationId: readMemory
      parameters:
        - name: address
          in: query
          required: true
          description: Start address in hexadecimal, 0000 to FFFF.
          schema:
            type: string
          example: D020
        - name: length
          in: query
          required: false
          description: Number of bytes to read.
          schema:
            type: integer
            minimum: 1
            maximum: 65536
            default: 256
          example: 2
      responses:
        '200':
          description: The bytes read.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid address:
                  value:
                    errors:
                      - Invalid address
                Invalid length:
                  value:
                    errors:
                      - Invalid length
                Memory read exceeds location $FFFF:
                  value:
                    errors:
                      - Memory read exceeds location $FFFF
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Out of memory:
                  value:
                    errors:
                      - Out of memory
  '/v1/machine:reboot':
